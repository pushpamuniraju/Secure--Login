<!doctype html><html><head><meta charset="UTF-8"><title>Register</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<div class="container"><div class="card"><h1>🛡️ Create Account</h1><p class="sub">Register securely</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Username</label><input name="username" minlength="3" maxlength="30" required><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" minlength="8" required><button type="submit">Register</button></form>
<div class="link">Already have an account? <a href="{{url_for('login')}}">Login</a></div></div></div></body></html>
