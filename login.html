<!doctype html><html><head><meta charset="UTF-8"><title>Secure Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<div class="container"><div class="card"><h1>🔐 Secure Login</h1><p class="sub">Sign in to your account</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required><button type="submit">Login</button></form>
<div class="link">New user? <a href="{{url_for('register')}}">Create an account</a></div></div></div></body></html>
